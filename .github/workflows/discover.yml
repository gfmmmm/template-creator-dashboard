# 레퍼런스 발굴 — 소스 계정에서 터진 릴스를 주워 discoveries.json 에 담고 커밋한다
# 3일마다 07:00 KST (= 22:00 UTC) · 손으로 돌리려면 Actions 탭 → Run workflow
name: discover

on:
  schedule:
    - cron: "0 22 */3 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm install 없음 — 이 저장소는 의존성이 0이다

      - name: 시크릿 확인
        run: |
          if [ -z "${{ secrets.SCRAPECREATORS_API_KEY }}" ]; then
            echo "::notice::SCRAPECREATORS_API_KEY 시크릿이 없습니다 — 이번 발굴은 건너뜁니다"
          fi

      - name: 레퍼런스 발굴
        env:
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
        run: node scripts/discover.js

      - name: 커밋·푸시
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # ⚠️ 무료 Vercel(Hobby)은 GitHub 계정에 연결되지 않은 작성자의 커밋을 배포하지 않는다.
          #    봇 이름으로 커밋하면 데이터는 쌓이는데 웹 주소가 옛 데이터에서 멈춘다 — daily.yml 의 설명 참조.
          NOREPLY="$(gh api "users/$OWNER" --jq '"\(.id)+\(.login)@users.noreply.github.com"' 2>/dev/null || true)"
          if [ -z "$NOREPLY" ]; then NOREPLY="$OWNER@users.noreply.github.com"; fi
          git config user.name "$OWNER"
          git config user.email "$NOREPLY"
          git add data/discoveries.json data/thumbs
          git diff --cached --quiet && echo "바뀐 게 없습니다" && exit 0
          git commit -m "자동: 레퍼런스 발굴 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase --autostash
          git push
