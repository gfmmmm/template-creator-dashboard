# 매일 스냅샷 — 팔로워 한 줄을 posts.json 에 적고 커밋한다 (추이 카드의 해상도 담당)
# 매일 07:00 KST (= 22:00 UTC 전날) · 손으로 돌리려면 Actions 탭 → Run workflow
name: daily

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm install 없음 — 이 저장소는 의존성이 0이다

      - name: 시크릿 확인
        run: |
          if [ -z "${{ secrets.SCRAPECREATORS_API_KEY }}" ]; then
            echo "::notice::SCRAPECREATORS_API_KEY 시크릿이 없습니다 — 오늘 스냅샷은 건너뜁니다"
          fi

      - name: 스냅샷
        env:
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
        run: node scripts/snapshot.js

      - name: 커밋·푸시
        if: always()
        run: |
          git config user.name "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posts.json
          git diff --cached --quiet && echo "바뀐 게 없습니다" && exit 0
          git commit -m "자동: 일일 스냅샷 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase --autostash
          git push
