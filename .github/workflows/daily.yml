# 매일 스냅샷 — 팔로워 한 줄을 posts.json 에 적고 커밋한다 (추이 카드의 해상도 담당)
# 매일 07:00 KST (= 22:00 UTC 전날) · 손으로 돌리려면 Actions 탭 → Run workflow
name: daily

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm install 없음 — 이 저장소는 의존성이 0이다

      - name: 시크릿 확인
        run: |
          if [ -z "${{ secrets.SCRAPECREATORS_API_KEY }}" ]; then
            echo "::notice::SCRAPECREATORS_API_KEY 시크릿이 없습니다 — 오늘 스냅샷은 건너뜁니다"
          fi

      - name: 스냅샷
        env:
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
        run: node scripts/snapshot.js

      - name: 커밋·푸시
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # ⚠️ 커밋한 사람이 누구인지가 배포를 좌우한다.
          #    무료 Vercel(Hobby)은 GitHub 계정에 연결되지 않은 작성자의 커밋을 배포하지 않는다
          #    ("Blocked — commit email"). 예전처럼 dashboard-bot 으로 커밋하면 GitHub 에는 데이터가
          #    쌓이는데 웹 주소는 옛 데이터에서 영영 멈춘다(Actions 는 초록불이라 알아채기도 어렵다).
          #    그래서 저장소 소유자의 GitHub noreply 이메일(<ID>+<로그인>@users.noreply.github.com)로 커밋한다.
          #    아이디를 코드에 박지 않고 매 실행마다 알아낸다 — 누가 이 템플릿을 받아도 그대로 돈다.
          NOREPLY="$(gh api "users/$OWNER" --jq '"\(.id)+\(.login)@users.noreply.github.com"' 2>/dev/null || true)"
          if [ -z "$NOREPLY" ]; then NOREPLY="$OWNER@users.noreply.github.com"; fi
          git config user.name "$OWNER"
          git config user.email "$NOREPLY"
          git add data/posts.json
          git diff --cached --quiet && echo "바뀐 게 없습니다" && exit 0
          git commit -m "자동: 일일 스냅샷 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase --autostash
          git push
